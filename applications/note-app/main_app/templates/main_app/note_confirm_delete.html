{% extends 'base.html' %}  
{% load static %} 

{% block content %}
<div class="page-header">
  <h1>Delete Note?</h1>
  <img src="{% static 'images/nerd-note.svg' %}" alt="A note using a computer" />
</div>

<h2>Are you sure you want to delete "{{ object.title }}"?</h2>

<form action="" method="post" class="form">
  {% csrf_token %}
  <a href="{% url 'note_detail' object.id %}" class="btn secondary">Cancel</a>
  <button type="submit" class="btn danger">Yes - Delete!</button>
</form>
{% endblock %}
