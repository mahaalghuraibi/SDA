{% extends 'base.html' %}
{% load static %}

{% block head %}
<link rel="stylesheet" href="{% static 'css/notes/notes-detail.css' %}">
{% endblock %}

{% block content %}
<section class="note-container">
  <div class="card">
    <h1>Delete Note?</h1>
    <form method="post">
      {% csrf_token %}
      <button type="submit">Delete</button>
      <a href="{% url 'note_detail' object.id %}">Cancel</a>
    </form>
  </div>
</section>
{% endblock %}
