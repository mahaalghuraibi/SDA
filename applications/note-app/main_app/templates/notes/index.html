{% extends 'base.html' %}
{% load static %}

{% block head %}
<link rel="stylesheet" href="{% static 'css/notes/notes-index.css' %}">
{% endblock %}


{% block content %}
<section class="page-header">
  <h1>All Notes</h1>
  <img src="{% static 'images/today-s-mood-277365833.webp' %}" alt="Today's mood" />
</section>

<section class="card-container">
  {% for note in notes %}
    <div class="card">
      <a href="{% url 'note_detail' note.id %}">
        <div class="card-content">
          <h2 class="card-title">{{ note.title }}</h2>
          <p>{{ note.body|truncatewords:20 }}</p>
        </div>
      </a>
    </div>
  {% empty %}
    <p>No notes yet!</p>
  {% endfor %}
</section>
{% endblock %}
