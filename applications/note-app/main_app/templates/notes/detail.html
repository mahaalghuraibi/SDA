{% extends 'base.html' %}
{% load static %}

{% block head %}
<link rel="stylesheet" href="{% static 'css/notes/notes-detail.css' %}">
{% endblock %}

{% block content %}
<section class="note-container">
  <div class="card">
    <h1>{{ note.title }}</h1>
    <p>{{ note.body }}</p>
    <div class="note-actions">
      <a href="{% url 'note_update' note.id %}">Edit</a>
      <a href="{% url 'note_delete' note.id %}">Delete</a>
    </div>
  </div>
</section>
{% endblock %}
